name: Development source regressions

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: development-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  pure-and-preparation:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: '10.0.401'
      - name: Prepare fixed public MIT parser
        shell: pwsh
        run: |
          python eng/prepare_parser.py
          if ($LASTEXITCODE -ne 0) { throw 'Parser preparation failed.' }
      - name: Run synthetic core, runtime and preparation regressions
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force evidence | Out-Null
          dotnet run --project tests/PsdTachieNext.Tests -c Release -- evidence/core-results.json
          if ($LASTEXITCODE -ne 0) { throw 'Core regressions failed.' }
          dotnet run --project tests/PsdTachieNext.RuntimeTests -c Release -- evidence/runtime-results.json
          if ($LASTEXITCODE -ne 0) { throw 'Runtime regressions failed.' }
          dotnet run --project tests/PsdTachieNext.PreparationTests -c Release -- evidence/preparation-results.json
          if ($LASTEXITCODE -ne 0) { throw 'Preparation regressions failed.' }
          dotnet build src/PsdTachieNext.Cli -c Release --nologo
          if ($LASTEXITCODE -ne 0) { throw 'CLI build failed.' }
      - name: Record source and result hashes
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force evidence | Out-Null
          $hashes = [ordered]@{}
          foreach ($name in @('core-results.json','runtime-results.json','preparation-results.json')) {
            $file = Join-Path evidence $name
            if (Test-Path $file) { $hashes[$name] = (Get-FileHash $file).Hash.ToLowerInvariant() }
          }
          $parser = $null
          if (Test-Path .deps/patched-src/provenance.json) { $parser = Get-Content .deps/patched-src/provenance.json -Raw | ConvertFrom-Json }
          [ordered]@{sourceHead=$env:SOURCE_HEAD;checkoutSha=$env:GITHUB_SHA;runId=$env:GITHUB_RUN_ID;runAttempt=$env:GITHUB_RUN_ATTEMPT;sdk=(dotnet --version);resultsSha256=$hashes;parser=$parser;syntheticOnly=$true;normalWriterVerified=$false} | ConvertTo-Json -Depth 6 | Set-Content evidence/pure-provenance.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: synthetic-pure-preparation-evidence
          path: |
            evidence/core-results.json
            evidence/runtime-results.json
            evidence/preparation-results.json
            evidence/pure-provenance.json
          retention-days: 3
          if-no-files-found: warn

  warp-and-host-build:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      HOST_VERSION: '4.56.1.0'
      HOST_ZIP_SHA256: '49c0ed689f545737b7ce939971bfc625962e00791c57883dc8e6f058aa336c5a'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: '10.0.401'
      - name: Prepare fixed public MIT parser
        shell: pwsh
        run: |
          python eng/prepare_parser.py
          if ($LASTEXITCODE -ne 0) { throw 'Parser preparation failed.' }
      - name: Run synthetic WARP renderer regressions
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force evidence | Out-Null
          dotnet run --project tests/PsdTachieNext.RendererTests -c Release -- evidence/flat-results.json
          if ($LASTEXITCODE -ne 0) { throw 'Flat WARP regressions failed.' }
          dotnet run --project tests/PsdTachieNext.TreeRendererTests -c Release -- evidence/tree-results.json
          if ($LASTEXITCODE -ne 0) { throw 'Tree WARP regressions failed.' }
      - name: Obtain exact official stable host temporarily
        shell: pwsh
        run: |
          $latest = Invoke-RestMethod https://api.github.com/repos/manju-summoner/YukkuriMovieMaker4/releases/latest
          if ($latest.tag_name -ne "v$env:HOST_VERSION" -or $latest.prerelease -or $latest.draft) { throw 'Official stable version changed; review and repin version/hash.' }
          $asset = $latest.assets | Where-Object name -eq "YukkuriMovieMaker_v$($env:HOST_VERSION)_Lite.zip"
          if (-not $asset -or $asset.digest -ne "sha256:$env:HOST_ZIP_SHA256") { throw 'Official asset identity differs.' }
          curl.exe -L --fail --retry 2 --silent --show-error -o host.zip $asset.browser_download_url
          if ($LASTEXITCODE -ne 0) { throw 'Official host download failed.' }
          if ((Get-FileHash host.zip).Hash.ToLowerInvariant() -ne $env:HOST_ZIP_SHA256) { throw 'Official host archive hash mismatch.' }
          Expand-Archive host.zip -DestinationPath .host
          $executables = @(Get-ChildItem .host -Recurse -Filter YukkuriMovieMaker.exe)
          if ($executables.Count -ne 1) { throw 'Unexpected host archive layout.' }
          $exe = $executables[0]
          if ([Diagnostics.FileVersionInfo]::GetVersionInfo($exe.FullName).FileVersion -ne $env:HOST_VERSION) { throw 'Host executable version differs.' }
          "YMM4_DIR=$($exe.Directory.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          [ordered]@{version=$env:HOST_VERSION;archiveSha256=$env:HOST_ZIP_SHA256;executableSha256=(Get-FileHash $exe.FullName).Hash.ToLowerInvariant();officialRelease=$latest.html_url;hostExecuted=$false} | ConvertTo-Json | Set-Content evidence/host-identity.json
      - name: Build adapter and integration driver against verified host
        shell: pwsh
        run: |
          dotnet build tests/PsdTachieNext.HostProof -c Release "-p:YMM4DirPath=$env:YMM4_DIR" --nologo
          if ($LASTEXITCODE -ne 0) { throw 'Host integration source build failed.' }
      - name: Record WARP and build boundary
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force evidence | Out-Null
          $hashes = [ordered]@{}
          foreach ($name in @('flat-results.json','tree-results.json','host-identity.json')) {
            $file = Join-Path evidence $name
            if (Test-Path $file) { $hashes[$name] = (Get-FileHash $file).Hash.ToLowerInvariant() }
          }
          [ordered]@{sourceHead=$env:SOURCE_HEAD;checkoutSha=$env:GITHUB_SHA;runId=$env:GITHUB_RUN_ID;runAttempt=$env:GITHUB_RUN_ATTEMPT;sdk=(dotnet --version);resultsSha256=$hashes;syntheticOnly=$true;warp=$true;realHostExecuted=$false;normalWriterVerified=$false;physicalGpuPerformanceVerified=$false} | ConvertTo-Json -Depth 4 | Set-Content evidence/warp-provenance.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: synthetic-warp-build-evidence
          path: |
            evidence/flat-results.json
            evidence/tree-results.json
            evidence/host-identity.json
            evidence/warp-provenance.json
          retention-days: 3
          if-no-files-found: warn
